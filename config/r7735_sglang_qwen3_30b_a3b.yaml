# SGLang + Qwen3-30B-A3B-Instruct (BF16) on the R7735.
# 2-socket EPYC, 32 physical cores per socket, 8 CCDs of 4 cores per
# socket, SMT enabled. Total 64 physical cores (CPUs 0-63).
#
# Uses the SGLang CPU Docker image; build instructions are in the
# README's "SGLang on CPU (Docker required)" section.
#
# Per the GNR runbook, TP=1 baseline + TP=4 are the only known-good
# parallelism shapes on SGLang CPU. Anything else (DP/EP combos)
# is upstream-broken at time of writing.
#
# This config keeps the SGLang launch flag list to the minimum the
# runbook proved out. ``mem_fraction_static`` and ``chunked_prefill_size``
# are left null so SGLang picks defaults; override only with evidence.
#
# AMD-specific divergence: ``attention_backend`` is null. SGLang prints
# "current platform does not support Intel AMX, will fallback to
# torch_native backend" on AMD and proceeds — that's fine.

engine:
  type: sglang
  # HF id for log identification. Actual weights are read from
  # model_local_path (the in-container path). The "-2507" suffix is
  # part of the published HF repo name, not a separate version tag.
  model_id: Qwen/Qwen3-30B-A3B-Instruct-2507
  model_local_path: /models/Qwen3-30B-A3B-Instruct-2507
  served_model_name: qwen3_30b_a3b
  quantization_kind: null      # BF16

  tensor_parallel_size: 1
  max_model_len: 8192
  max_total_tokens: 16384      # KV pool cap from the runbook
  context_length: null         # let SGLang use the model default
  chunked_prefill_size: null   # SGLang default
  mem_fraction_static: null    # SGLang default
  disable_overlap_schedule: true
  enable_metrics: true
  attention_backend: null      # AMD: torch_native via fallback

  port: 30000
  host: 127.0.0.1
  startup_timeout_s: 1800      # ~10-20 min for 30B BF16 cold load

  # Engine-agnostic CPU pinning. Drives:
  #   * frequency-collector filter
  #   * docker --cpuset-cpus
  #   * SGLANG_CPU_OMP_THREADS_BIND derivation (must align with TP)
  #
  # The runbook uses '0-63' (full machine, both sockets) for TP=1.
  # That works here too — switch to '0-63' if you want both sockets.
  # Single-socket '0-31' is the cleaner NUMA-isolated baseline.
  cpu_bind: '0-31'

  docker_image: sglang-cpu:xeon-fixed
  docker_shm_size: 32g
  docker_network: host
  docker_volumes:
    /data/ml/models: /models
    /data/ml/huggingface: /root/.cache/huggingface

  # In-container OpenMP placement.
  # Don't set OMP_PROC_BIND / OMP_PLACES — they conflict with
  # SGLANG_CPU_OMP_THREADS_BIND and trigger libnuma "out of range"
  # warnings + segfaults on some hosts during torch.distributed init.
  sglang_extra_env: {}

simulation:
  # See xeon_sglang_qwen3_30b_a3b_fp8.yaml for the math behind these
  # values — closed-loop chat workloads with long think-times can't
  # reach CV<0.15 at small pool sizes, so we relax both the threshold
  # and start with a meaningful pool.
  initial_pool_size: 8
  max_pool_size: 256
  target_samples_per_step: 50
  measurement_timeout_s: 600
  ramp_spawn_interval_s: 2.0
  initial_phase_offset_enabled: true
  warmup_min_duration_s: 30
  warmup_max_duration_s: 300
  convergence_window_s: 60
  convergence_threshold: 0.20
  convergence_min_completions_per_window: 5
  knee_slope_threshold: 0.005
  stop_violation_threshold: 0.5
  max_total_duration_minutes: 240
  enable_token_timestamps: false
  snapshot_interval_s: 1
  request_timeout_s: 600

telemetry:
  enable_pmu: true
  enable_memory_bandwidth: true   # uncore_imc isn't on AMD; collector reports unavailable
  enable_power: true
  enable_engine_metrics: true
  enable_amx_utilization: false   # no AMX on EPYC
  perf_events:
    - cycles
    - instructions
    - cache-misses
    - cache-references

output:
  db_directory: runs
  json_export: true
