# SGLang + Qwen3-30B-A3B (FP8) on the R7735 (2-socket EPYC, 32 physical
# cores per socket, 8 CCDs of 4 cores per socket, SMT enabled).
#
# Single-socket TP=1 baseline. Per the GNR runbook, TP=1 and TP=4 are
# the ONLY known-good parallelism shapes on SGLang CPU; DP / EP combos
# are upstream-broken at time of writing. Stick to these.
#
# This configuration runs SGLang inside Docker (sglang-cpu:xeon-fixed)
# because the mainline pip wheel ships GPU-only sgl_kernel binaries.
# Build the image with:
#
#   docker pull lmsysorg/sglang:latest-cpu
#   docker tag  lmsysorg/sglang:latest-cpu sglang-cpu:xeon
#   docker build -f Dockerfile.xeon-fixed -t sglang-cpu:xeon-fixed .
#
# AMD-specific divergence from the GNR runbook:
#   * attention_backend left null (no AMX on AMD; SGLang falls back to
#     torch_native automatically and prints "current platform does not
#     support Intel AMX, will fallback to torch_native backend").
#   * The IPEX-based base image still works on AMD, though some Intel-
#     only optimisations are silently skipped — that's fine for this
#     baseline measurement.

engine:
  type: sglang
  # Local mounted path inside the container; weights live at
  # /data/ml/models/Qwen3-30B-A3B-Instruct-FP8 on the host.
  model_id: Qwen/Qwen3-30B-A3B-Instruct-FP8
  model_local_path: /models/Qwen3-30B-A3B-Instruct-FP8
  served_model_name: qwen3_30b_a3b_fp8
  quantization_kind: fp8

  tensor_parallel_size: 1
  max_model_len: 8192
  max_total_tokens: 16384
  chunked_prefill_size: 4096
  mem_fraction_static: 0.85
  disable_overlap_schedule: true

  port: 30000
  host: 127.0.0.1
  startup_timeout_s: 1800       # 30B FP8 cold load is ~10–20 minutes

  # Engine-agnostic CPU pinning. Used for:
  #   * frequency-collector filter
  #   * docker --cpuset-cpus
  #   * SGLANG_CPU_OMP_THREADS_BIND derivation (must align with TP)
  cpu_bind: '0-31'

  # AMD-specific: leave attention backend at SGLang default (torch_native
  # via fallback). On Intel Xeon you'd set this to 'intel_amx'.
  attention_backend: null

  # Docker layer-fixed image. Build per the comment block above.
  docker_image: sglang-cpu:xeon-fixed
  docker_shm_size: 32g
  docker_network: host
  docker_volumes:
    /data/ml/models: /models
    /data/ml/huggingface: /root/.cache/huggingface

  # OpenMP placement defaults inside the container.
  sglang_extra_env:
    OMP_NUM_THREADS: '32'
    OMP_PROC_BIND: 'close'
    OMP_PLACES: 'cores'

simulation:
  initial_pool_size: 2          # MoE is slower per-request than dense 7B
  max_pool_size: 256
  target_samples_per_step: 300
  measurement_timeout_s: 360
  stabilization_cv_threshold: 0.15
  stabilization_min_duration_s: 60
  stabilization_max_duration_s: 300
  knee_slope_threshold: 0.005
  stop_violation_threshold: 0.5
  max_total_duration_minutes: 240
  enable_token_timestamps: false
  snapshot_interval_s: 1
  request_timeout_s: 360

telemetry:
  enable_pmu: true
  enable_memory_bandwidth: true   # uncore_imc isn't on AMD; collector reports unavailable
  enable_power: true
  enable_engine_metrics: true
  enable_amx_utilization: false   # no AMX on EPYC
  perf_events:
    - cycles
    - instructions
    - cache-misses
    - cache-references

output:
  db_directory: runs
  json_export: true
