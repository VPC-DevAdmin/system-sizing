# SGLang + Qwen3-30B-A3B-Instruct-2507-FP8 on the R7735.
#
# !!! INTEL-ONLY !!!
# SGLang's CPU FP8 path requires Intel AMX. On AMD it aborts during
# weight processing with::
#
#     AssertionError: Fp8LinearMethod on CPU requires that CPU has
#     AMX support
#
# This config is preserved for the eventual Xeon comparison run; on
# the R7735 (EPYC) use r7735_sglang_qwen3_30b_a3b.yaml (BF16) instead.
#
# Sibling of r7735_sglang_qwen3_30b_a3b.yaml — same machine, same
# parallelism shape, same telemetry. The differences are:
#
#   * model_id / model_local_path point at the FP8 variant
#   * served_model_name carries an _fp8 suffix for routing clarity
#   * quantization_kind: fp8 (passed through as ``--quantization fp8``)
#
# Resident size for FP8 is ~32 GB vs ~58 GB for BF16; that frees memory
# for a larger KV pool, but the conservative ``max_total_tokens=16384``
# default is kept here so the two configs are A/B-comparable. Bump it
# if you want to exercise more concurrent users on the FP8 run.

engine:
  type: sglang
  # The "-2507" suffix is part of the actual published HF repo name,
  # not a separate version tag.
  model_id: Qwen/Qwen3-30B-A3B-Instruct-2507-FP8
  model_local_path: /models/Qwen3-30B-A3B-Instruct-2507-FP8
  served_model_name: qwen3_30b_a3b_fp8
  quantization_kind: fp8

  tensor_parallel_size: 1
  max_model_len: 8192
  max_total_tokens: 16384      # KV pool cap from the runbook
  context_length: null         # let SGLang use the model default
  chunked_prefill_size: null   # SGLang default
  mem_fraction_static: null    # SGLang default
  disable_overlap_schedule: true
  enable_metrics: true
  attention_backend: null      # AMD: torch_native via fallback

  # Hardware preflight — fails fast on non-Intel hosts. SGLang's
  # ``Fp8LinearMethod`` aborts deep in weight processing on AMD with
  # "requires CPU AMX support"; surface the misconfig at startup.
  hardware_requirements:
    cpu_vendor: intel
    cpu_features:
      - amx_tile
      - amx_bf16
    notes: "SGLang CPU FP8 path needs Intel AMX (unavailable on EPYC)"

  port: 30000
  host: 127.0.0.1
  startup_timeout_s: 1200      # ~1-2 min for FP8 cold load; 20 min cap

  # Engine-agnostic CPU pinning. Drives:
  #   * frequency-collector filter
  #   * docker --cpuset-cpus
  #   * SGLANG_CPU_OMP_THREADS_BIND derivation (must align with TP)
  #
  # Single-socket '0-31' for clean NUMA isolation. Switch to '0-63'
  # to span both sockets (TP=1 still valid; the runbook uses 0-63).
  cpu_bind: '0-31'

  docker_image: sglang-cpu:xeon-fixed
  docker_shm_size: 32g
  docker_network: host
  docker_volumes:
    /data/ml/models: /models
    /data/ml/huggingface: /root/.cache/huggingface

  sglang_extra_env:
    OMP_PROC_BIND: 'close'
    OMP_PLACES: 'cores'

simulation:
  initial_pool_size: 2          # MoE is slower per-request than dense 7B
  max_pool_size: 256
  target_samples_per_step: 300
  measurement_timeout_s: 360
  stabilization_cv_threshold: 0.15
  stabilization_min_duration_s: 60
  stabilization_max_duration_s: 300
  knee_slope_threshold: 0.005
  stop_violation_threshold: 0.5
  max_total_duration_minutes: 240
  enable_token_timestamps: false
  snapshot_interval_s: 1
  request_timeout_s: 360

telemetry:
  enable_pmu: true
  enable_memory_bandwidth: true   # uncore_imc isn't on AMD; collector reports unavailable
  enable_power: true
  enable_engine_metrics: true
  enable_amx_utilization: false   # no AMX on EPYC
  perf_events:
    - cycles
    - instructions
    - cache-misses
    - cache-references

output:
  db_directory: runs
  json_export: true
