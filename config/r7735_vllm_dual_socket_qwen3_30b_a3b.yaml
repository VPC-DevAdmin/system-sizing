# vLLM-CPU dual-replica on R7735 (2× AMD EPYC 9374F).
#
# 64 physical cores split across 2 NUMA nodes (32 cores per socket).
# Two independent vLLM replicas, one per NUMA node. The simulator
# hash-load-balances virtual users across replicas with sticky
# assignment (each user always lands on the same replica) so multi-
# turn conversations preserve prefix-cache locality. Scales nearly
# linearly (~2×) on dual-socket vs the ~1.4× you'd get from TP=2
# across sockets (Gloo all-reduce becomes the bottleneck).
#
# CRITICAL: this engine REQUIRES the upstream vllm/vllm-openai-cpu
# image — its torch wheel has the AVX-512 BF16 dispatch that AMD
# needs. The SGLang ``sglang-cpu:xeon-fixed`` image runs at ~3% of
# theoretical compute on EPYC and is not viable.
#
# Architecture:
#   benchmark client → 127.0.0.1:8000  (vLLM r0, NUMA 0, cores 0-31)
#                   └→ 127.0.0.1:8001  (vLLM r1, NUMA 1, cores 32-63)
#   The simulator's pool manager owns the per-user routing; no proxy.
#
# ── Engine optimizer findings (2026-05-05, scripts/engine_optimizer.py) ──
# Tested 11 vLLM-CPU launch shapes. Two complementary winners:
#
#   ``block_32``  improves the low-concurrency cells (single_stream c=1,
#                 short_throughput c=8) by reducing per-block KV
#                 bookkeeping overhead.
#   ``kv_xl_120`` (KVCACHE_SPACE=120 GB per replica) eliminates the
#                 catastrophic c=16 long-prompt tail. The original
#                 80 GB baseline showed a BIMODAL 900-second p95 tail on
#                 long_pain_16 — confirmed as KV-pressure-induced (head-
#                 of-line eviction). Bumping to 120 GB resolves it:
#
#                   long_pain c=16 ttft p95:  900996 ms → 1045 ms
#                   long_pain c=16 aggregate:    8.7 tok/s → 152 tok/s
#
# ``chunked_prefill`` alone produced essentially identical c=16 numbers
# to kv_xl_120 (TTFT p95 1060 ms, aggregate 151 tok/s), but stacked
# DESTRUCTIVELY with block_32 — the chunked_prefill_block_32 combo
# reproduced the 900 s tail. Default scheduler + larger KV is the
# proven non-interacting choice.
#
# Configurations tested and rejected:
#   * batch_budget — matched chunked_prefill on c=16 but had a 900 s
#     tail at c=8 (one-sample artifact, but enough to disqualify).
#   * no_prefix_cache — catastrophic regression on every concurrency-
#     stressed cell. Never disable prefix caching.
#   * kv_xl (160 GB) — health check timeout, possibly genuine memory
#     pressure at startup.
#   * single_replica_64core — ~30% lower aggregate throughput than
#     dual-replica on concurrent workloads.
#   * tp2_cross_socket / tp2_chunked_prefill — distributed-init failure
#     (~25s Gloo hang, never resolved). Cuts TTFT in half but trades
#     ~30% TPOT due to decode crossing the NUMA boundary; even if it
#     ran cleanly the trade isn't a clear win. Skip TP=2 across NUMA
#     on AMD vLLM-CPU.
#
# Quantization paths surveyed and unavailable on this stack:
#   * vLLM-CPU FP8       — KeyError: PlatformEnum.CPU (no dispatch).
#   * vLLM-CPU GPTQ-INT8 — gptq_shuffle operator not compiled into
#                          the CPU _C extension.
#   * vLLM-CPU AWQ-WNA16 — gptq_marlin_repack operator missing from CPU.
#   * SGLang xeon FP8    — hard assert requires AMX (AMD doesn't have).
# BF16 is the floor; quantization is not a lever on this hardware.
#
# Verified working on this hardware (EPYC 9374F, 386 GB DDR5) with
# Qwen3-30B-A3B-Instruct-2507 BF16, runbook dated 2026-05-03.
#
# ── Concurrent-prefill serialization on vLLM-CPU (2026-05-07) ─────
# IMPORTANT structural property of this stack: the vLLM-CPU prefill
# scheduler does NOT parallelize concurrent unique-prompt prefills
# within a single replica. Each prefill runs serially (or near-
# serially with marginal overlap). Empirical confirmation from a
# 4-request isolation test on this hardware:
#
#   Single isolated 2.5K-token prefill         : 8.7 s
#   4× concurrent identical (cache-hitting)   : 1.0 s each
#   4× concurrent unique-prompt prefills      : 13.8 / 20.5 / 27.2 / 31.4 s
#                                               (~7 s wall-clock per request,
#                                                served roughly one after
#                                                another)
#
# Implication for the simulator's long-context cohorts:
#   TTFT_user_N  ≈  (N / num_replicas) × single_prefill_s
#
# pool=8 of unique long-context prompts on this dual-replica config →
# user 8 sees ~28 s TTFT. The simulator captured this correctly.
# The "summarizer cap=2 / analyst_team cap=6" numbers from the
# 2026-05-07 run aren't measurement error; they're the actual
# serialization floor.
#
# This is a vLLM-CPU scheduler characteristic, not a knob. The only
# levers that would meaningfully reduce per-prefill compute on this
# hardware (quantization, AMX) are unavailable. TP=2 across NUMA
# would give each prefill 64 cores but Gloo distributed-init fails
# (see above) and the ~30% TPOT penalty likely outweighs the ~50%
# TTFT gain even if it ran cleanly.
#
# Buyer-page narrative for this platform: chat-style workloads
# (short prompts, multi-turn with cache reuse) scale to ~100+
# concurrent users; long-context workloads (≥2K-token unique
# prompts) are prefill-serialization-limited and the realistic
# concurrent ceiling is num_replicas × small constant.

engine:
  type: vllm_dual_socket
  model_id: Qwen/Qwen3-30B-A3B-Instruct-2507
  model_local_path: /models/Qwen3-30B-A3B-Instruct-2507
  served_model_name: qwen3_30b_a3b
  quantization_kind: null              # BF16

  max_model_len: 8192
  startup_timeout_s: 1800              # ~90-120s per replica

  host: 127.0.0.1

  # Optimizer-validated engine knobs (see header). Applied to every
  # replica via vllm_extra_flags. The dual_socket engine launcher
  # appends these to the per-replica ``docker run … vllm/...`` cmd.
  vllm_extra_flags:
    - --block-size
    - "32"

  # ── Container image ──
  vllm_image: vllm/vllm-openai-cpu:latest-x86_64

  # ── Replicas ──
  # Pin to physical cores only (skip SMT siblings 64-127 — using them
  # hurts BF16 matmul because the AVX-512 SIMD unit is shared between
  # SMT siblings on Zen4). VLLM_CPU_OMP_THREADS_BIND must match the
  # cpuset_cpus exactly.
  #
  # VLLM_CPU_KVCACHE_SPACE is in GB. 120 GB per replica: optimizer-
  # validated (long_pain c=16 TTFT p95 dropped from 900 s to 1.05 s
  # vs the 80 GB baseline). 240 GB total across two replicas, 386 GB
  # host RAM, ~38 GB/replica weights → comfortable headroom. 160 GB
  # tested and failed startup, so 120 is the validated upper bound.
  replicas:
    - name: r0
      cpuset_cpus: '0-31'
      cpuset_mems: '0'
      port: 8000
      env:
        VLLM_CPU_KVCACHE_SPACE: '120'
        VLLM_CPU_OMP_THREADS_BIND: '0-31'
        OMP_NUM_THREADS: '32'

    - name: r1
      cpuset_cpus: '32-63'
      cpuset_mems: '1'
      port: 8001
      env:
        VLLM_CPU_KVCACHE_SPACE: '120'
        VLLM_CPU_OMP_THREADS_BIND: '32-63'
        OMP_NUM_THREADS: '32'

  shutdown_grace_s: 30

  # Volume mounts (model weights live on host, mounted read-only).
  docker_volumes:
    /data/ml/models: /models
    /data/ml/huggingface: /root/.cache/huggingface

  # ── Hardware preflight ──
  # AMD-specific: the BF16 dispatch in the vllm image needs Zen3+
  # (AVX-512 was added in Zen4 / EPYC 9004 series).
  hardware_requirements:
    cpu_vendor: amd
    cpu_features:
      - avx512f
      - avx512_bf16
    min_sockets: 2
    notes: "Dual-socket EPYC required for the 2-replica NUMA-pinned layout"

simulation:
  ramp_spawn_interval_s: 2.0
  initial_phase_offset_enabled: true
  initial_pool_size: 8
  max_pool_size: 256
  # 100 samples per step trades wall time for noise: at p=0.10, the
  # 2σ band shrinks from ±8pp (n=50) to ±6pp (n=100). Enough to
  # separate genuine knee-crossings from noise wobbles like the
  # 18%-then-8% non-monotonic pair we saw at n=50.
  target_samples_per_step: 100
  measurement_timeout_s: 600
  warmup_min_duration_s: 30
  warmup_max_duration_s: 300
  convergence_window_s: 60
  convergence_threshold: 0.20
  convergence_min_completions_per_window: 5
  knee_slope_threshold: 0.005
  stop_violation_threshold: 0.5
  max_total_duration_minutes: 240
  enable_token_timestamps: false
  snapshot_interval_s: 1
  request_timeout_s: 600

telemetry:
  enable_pmu: true
  enable_memory_bandwidth: true   # uncore_imc isn't on AMD; collector reports unavailable
  enable_power: true
  enable_engine_metrics: true     # vLLM /metrics works; the dual-socket engine aggregates both replicas
  enable_amx_utilization: false   # no AMX on EPYC
  perf_events:
    - cycles
    - instructions
    - cache-misses
    - cache-references

output:
  db_directory: runs
  json_export: true
