# vLLM-CPU dual-replica on R7735 (2× AMD EPYC 9374F).
#
# 64 physical cores split across 2 NUMA nodes (32 cores per socket).
# Two independent vLLM replicas, one per NUMA node. The simulator
# hash-load-balances virtual users across replicas with sticky
# assignment (each user always lands on the same replica) so multi-
# turn conversations preserve prefix-cache locality. Scales nearly
# linearly (~2×) on dual-socket vs the ~1.4× you'd get from TP=2
# across sockets (Gloo all-reduce becomes the bottleneck).
#
# CRITICAL: this engine REQUIRES the upstream vllm/vllm-openai-cpu
# image — its torch wheel has the AVX-512 BF16 dispatch that AMD
# needs. The SGLang ``sglang-cpu:xeon-fixed`` image runs at ~3% of
# theoretical compute on EPYC and is not viable.
#
# Architecture:
#   benchmark client → 127.0.0.1:8000  (vLLM r0, NUMA 0, cores 0-31)
#                   └→ 127.0.0.1:8001  (vLLM r1, NUMA 1, cores 32-63)
#   The simulator's pool manager owns the per-user routing; no proxy.
#
# Verified working on this hardware (EPYC 9374F, 386 GB DDR5) with
# Qwen3-30B-A3B-Instruct-2507 BF16, runbook dated 2026-05-03.

engine:
  type: vllm_dual_socket
  model_id: Qwen/Qwen3-30B-A3B-Instruct-2507
  model_local_path: /models/Qwen3-30B-A3B-Instruct-2507
  served_model_name: qwen3_30b_a3b
  quantization_kind: null              # BF16

  max_model_len: 8192
  startup_timeout_s: 1800              # ~90-120s per replica

  host: 127.0.0.1

  # ── Container image ──
  vllm_image: vllm/vllm-openai-cpu:latest-x86_64

  # ── Replicas ──
  # Pin to physical cores only (skip SMT siblings 64-127 — using them
  # hurts BF16 matmul because the AVX-512 SIMD unit is shared between
  # SMT siblings on Zen4). VLLM_CPU_OMP_THREADS_BIND must match the
  # cpuset_cpus exactly. VLLM_CPU_KVCACHE_SPACE is in GB; 80 GB per
  # replica is enough headroom for typical chat workloads at
  # max-model-len 8192.
  replicas:
    - name: r0
      cpuset_cpus: '0-31'
      cpuset_mems: '0'
      port: 8000
      env:
        VLLM_CPU_KVCACHE_SPACE: '80'
        VLLM_CPU_OMP_THREADS_BIND: '0-31'
        OMP_NUM_THREADS: '32'

    - name: r1
      cpuset_cpus: '32-63'
      cpuset_mems: '1'
      port: 8001
      env:
        VLLM_CPU_KVCACHE_SPACE: '80'
        VLLM_CPU_OMP_THREADS_BIND: '32-63'
        OMP_NUM_THREADS: '32'

  shutdown_grace_s: 30

  # Volume mounts (model weights live on host, mounted read-only).
  docker_volumes:
    /data/ml/models: /models
    /data/ml/huggingface: /root/.cache/huggingface

  # ── Hardware preflight ──
  # AMD-specific: the BF16 dispatch in the vllm image needs Zen3+
  # (AVX-512 was added in Zen4 / EPYC 9004 series).
  hardware_requirements:
    cpu_vendor: amd
    cpu_features:
      - avx512f
      - avx512_bf16
    min_sockets: 2
    notes: "Dual-socket EPYC required for the 2-replica NUMA-pinned layout"

simulation:
  ramp_spawn_interval_s: 2.0
  initial_phase_offset_enabled: true
  initial_pool_size: 8
  max_pool_size: 256
  target_samples_per_step: 50
  measurement_timeout_s: 600
  warmup_min_duration_s: 30
  warmup_max_duration_s: 300
  convergence_window_s: 60
  convergence_threshold: 0.20
  convergence_min_completions_per_window: 5
  knee_slope_threshold: 0.005
  stop_violation_threshold: 0.5
  max_total_duration_minutes: 240
  enable_token_timestamps: false
  snapshot_interval_s: 1
  request_timeout_s: 600

telemetry:
  enable_pmu: true
  enable_memory_bandwidth: true   # uncore_imc isn't on AMD; collector reports unavailable
  enable_power: true
  enable_engine_metrics: true     # vLLM /metrics works; the dual-socket engine aggregates both replicas
  enable_amx_utilization: false   # no AMX on EPYC
  perf_events:
    - cycles
    - instructions
    - cache-misses
    - cache-references

output:
  db_directory: runs
  json_export: true
