# SGLang + Qwen3-30B-A3B-Instruct-2507-FP8 on Intel Xeon (Granite
# Rapids / Sapphire Rapids / Emerald Rapids — anything with AMX).
#
# This is the Intel-AMX fast path. SGLang's CPU FP8 implementation
# (Fp8LinearMethod) explicitly requires AMX and aborts on non-Intel
# hardware; the hardware_requirements block below catches that before
# launch via the preflight check.
#
# Per the GNR runbook (sibling project, confirmed working):
#   * TP=1 baseline + TP=4 are the only known-good parallelism shapes
#     on SGLang CPU. DP/EP combos are upstream-broken at time of writing.
#   * TP=4 with 16 cores per worker on a single 64-core socket is the
#     reference layout. SGLANG_CPU_OMP_THREADS_BIND is auto-derived
#     from cpu_bind and validated against tensor_parallel_size at
#     launch (mismatches surface immediately).
#   * --attention-backend intel_amx is the AMX-aware kernel; without it
#     SGLang falls back to torch_native and AMX never engages, so this
#     is what makes Xeon decode fast vs the AMD fallback path.

engine:
  type: sglang
  # The "-2507" suffix is part of the published HF repo name.
  model_id: Qwen/Qwen3-30B-A3B-Instruct-2507-FP8
  model_local_path: /models/Qwen3-30B-A3B-Instruct-2507-FP8
  served_model_name: qwen3_30b_a3b_fp8
  quantization_kind: fp8

  tensor_parallel_size: 4
  max_model_len: 8192
  # Project policy: software caps must not be the bottleneck. The KV
  # pool is sized as ``mem_fraction_static × available_memory`` per
  # TP worker; we set the fraction so the only ceiling is physical RAM.
  max_total_tokens: null
  context_length: null
  # ``--chunked-prefill-size`` is kept from the GNR runbook — it
  # controls per-step prefill batch size (compute), not pool size.
  chunked_prefill_size: 4096
  # ── mem_fraction_static for TP>1 on a single NUMA node ──
  # SGLang can't determine per-rank memory budget when TP > NUMA-node
  # count. Each of the TP=4 worker processes sees the SAME available
  # memory (~990 GB) and independently allocates fraction × that. So
  # mem_fraction_static must be ≤ 1/TP minus headroom or the kernel
  # OOM-kills a worker during init.
  #
  # 0.20 × 4 workers = 0.80 of memory used for KV pool across all
  # ranks (~190 GB per worker, ~760 GB total). Leaves ~150 GB margin
  # for OS, scratch, fragmentation, and weight residency that already
  # consumed ~152 GB (38 GB × 4 ranks).
  #
  # If you change tensor_parallel_size, update this proportionally:
  #   TP=1 → 0.85    TP=2 → 0.40    TP=4 → 0.20    TP=8 → 0.10
  mem_fraction_static: 0.20
  disable_overlap_schedule: true
  enable_metrics: true
  attention_backend: intel_amx

  port: 30000
  host: 127.0.0.1
  startup_timeout_s: 1200       # ~1-2 min for FP8 cold load on Xeon

  # 4 groups × 16 cores = 64 cores on socket 0. Drives:
  #   * frequency-collector filter
  #   * docker --cpuset-cpus
  #   * SGLANG_CPU_OMP_THREADS_BIND derivation (validated TP-aligned)
  #
  # For TP=1 baseline: change to cpu_bind: '0-63' and tensor_parallel_size: 1.
  cpu_bind: '0-15|16-31|32-47|48-63'

  docker_image: sglang-cpu:xeon-fixed
  docker_shm_size: 32g
  docker_network: host
  docker_volumes:
    /data/ml/models: /models
    /data/ml/huggingface: /root/.cache/huggingface

  # Intentionally NOT setting OMP_PROC_BIND / OMP_PLACES. SGLang's CPU
  # backend uses ``SGLANG_CPU_OMP_THREADS_BIND`` to do its own per-rank
  # thread placement; layering OMP_PROC_BIND=close + OMP_PLACES=cores on
  # top causes the OpenMP runtime to override SGLang's bind and ask
  # libnuma to bind to CPUs outside its (cgroup-limited) allowed set,
  # producing ``libnuma: Warning: cpu argument N is out of range``
  # followed by a segfault during torch.distributed init.
  sglang_extra_env: {}

  # Hardware preflight — fails fast on non-Intel hosts. SGLang's
  # ``Fp8LinearMethod`` aborts deep in weight processing on AMD with
  # "requires CPU AMX support"; surface the misconfig at startup.
  hardware_requirements:
    cpu_vendor: intel
    cpu_features:
      - amx_tile
      - amx_bf16
    notes: "SGLang CPU FP8 path needs Intel AMX (unavailable on EPYC)"

simulation:
  # Sizing is tuned for slow CPU inference of a 30B MoE.
  # ── initial_pool_size ──
  # Closed-loop chat workloads have in-flight ≈ Binomial(pool, duty)
  # where duty = request_time / (request_time + think_time). For this
  # cohort + this engine that's ≈ 0.33 (10s req, 20s think). Pool=2
  # gives mean in-flight 0.66, std 0.67 — CV ≈ 1.0 every measurement
  # interval. Stabilisation is mathematically impossible at small pool
  # sizes; start at 8 so the in-flight count is meaningfully > 0 most
  # of the time and the variance is bounded.
  initial_pool_size: 8
  max_pool_size: 256
  # ── target_samples_per_step ──
  # 100 samples is the time-vs-noise compromise: at p=0.10 the 2σ
  # band shrinks from ±8pp (n=50) to ±6pp (n=100), enough to keep
  # the violation curve monotonic, without paying for the ±3.5pp
  # precision at n=300 that turns a 6-step ramp into a 3-hour run.
  target_samples_per_step: 100
  measurement_timeout_s: 600
  # ── soft-start ramp ──
  # Spawn one virtual user per N seconds rather than all-at-once. With
  # request_time≈30s and 8 users, a 2s spawn interval spreads the
  # initial burst over ~14s — combined with each user's random initial
  # phase offset (sleep for a fraction of one think-time before the
  # first request), this dissolves the synchronised wave that
  # instantaneous spawning produced.
  ramp_spawn_interval_s: 2.0
  initial_phase_offset_enabled: true

  # ── convergence gates ──
  # Measurement starts when completion rate over the most recent 60s
  # window is within ±20% of the rate over the previous 60s window —
  # the actual signal of "system has reached steady state". A 30s
  # warmup floor protects against premature convergence on noise; 300s
  # ceiling proceeds anyway if convergence isn't hit.
  warmup_min_duration_s: 30
  warmup_max_duration_s: 300
  convergence_window_s: 60
  convergence_threshold: 0.20
  convergence_min_completions_per_window: 5
  knee_slope_threshold: 0.005
  stop_violation_threshold: 0.5
  max_total_duration_minutes: 240
  enable_token_timestamps: false
  snapshot_interval_s: 1
  request_timeout_s: 600

telemetry:
  enable_pmu: true
  enable_memory_bandwidth: true   # uncore_imc per-IMC discovery on GNR
  enable_power: true
  enable_engine_metrics: true
  enable_amx_utilization: true    # Intel: oneDNN log will show AMX dispatches
  perf_events:
    - cycles
    - instructions
    - cycle_activity.stalls_mem_any
    - cycle_activity.stalls_l3_miss
    - cache-misses
    - cache-references
    - longest_lat_cache.reference
    - longest_lat_cache.miss
    - offcore_requests.all_data_rd
    - offcore_requests.demand_data_rd
    - mem_load_l3_miss_retired.local_dram
    - mem_load_l3_miss_retired.remote_dram

output:
  db_directory: runs
  json_export: true
