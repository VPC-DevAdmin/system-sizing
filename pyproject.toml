[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capsim"
version = "0.2.0"
description = "AI sizing and capacity engine — persona-based capacity benchmarking for LLM inference systems"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "transformers>=4.44",
    "tokenizers>=0.20",
    "numpy>=1.26",
    "psutil>=5.9",
    # CLI + accelerated transfer for ``make ready`` model downloads.
    # Without [cli] extras the venv has no ``hf`` binary; without
    # hf_transfer the download falls back to plain HTTP and is much
    # slower for multi-GB shards.
    "huggingface_hub[cli,hf_transfer]>=0.24",
    # Export-contract validation (capsim smoke gate + validate_export).
    "jsonschema>=4.21",
    # Control-plane service (capsim serve) + the mock engine's SSE server.
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
capsim = "simulator.cli:app"
# Deprecated alias — kept for one release so existing muscle memory and
# scripts keep working; prefer ``capsim``.
simulator = "simulator.cli:app"

[tool.setuptools.packages.find]
include = ["simulator*"]

[tool.setuptools.package-data]
simulator = ["export_schema/*.json", "ui/*", "ui/lib/*", "ui/vendor/*", "personas_data/*.yaml", "models_data/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Correctness (E/F), bugbear (B), and import hygiene (I). B008 is
# excluded deliberately: typer.Option()-in-default is the Typer idiom.
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"]
