[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "persona-capacity-simulator"
version = "0.1.0"
description = "Persona-based capacity simulator for LLM inference engines"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "transformers>=4.44",
    "tokenizers>=0.20",
    "numpy>=1.26",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
simulator = "simulator.cli:app"

[tool.setuptools.packages.find]
include = ["simulator*"]
