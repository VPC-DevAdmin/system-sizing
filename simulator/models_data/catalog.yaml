# Packaged model catalog — the starter set of models capsim knows how
# to stage, sweep, and search over. Local additions go in
# config/models/*.yaml (same schema; the UI's "Add model" writes
# config/models/local.yaml) and win over this file by id.
#
# Entry fields:
#   id             HF repo id (required)
#   family         groups precision variants of the same weights
#   series         vendor family line as an operator says it ("Qwen3")
#   params_b       total parameters in billions (drives size grouping)
#   specialty      instruct (default) | coder
#   moe            true for mixture-of-experts models
#   quant          bf16 | fp8 | awq | gptq-int4 | gptq-int8 | mxfp4 | nvfp4
#   approx_size_gb rough weight footprint (planning aid)
#   min_vram_gb    smallest single-replica VRAM that loads it
#   gated          true when the repo needs an accepted license + HF_TOKEN
#   engine_args    extra vLLM flags this artifact needs, if any
#   notes          one-liner for the UI
#   gguf           optional GGUF companion for the GGUF engines --
#                  KTransformers and llama.cpp (llama-server) -- which
#                  load weights from GGUF only (the HF repo above supplies
#                  config + tokenizer). Prepare stages it next to the
#                  weights and each launcher resolves its GGUF path from
#                  it. Its presence is what makes the entry eligible for
#                  those engines.
#                    repo     HF repo id holding the GGUF
#                    file     one .gguf file in that repo (a path when the
#                             repo shards quants into subdirectories), OR
#                             a directory when the quant is split into
#                             -00001-of-0000N shards (every shard is
#                             staged; KTransformers reads the directory,
#                             llama-server opens the first shard)
#                    size_gb  its size (all shards), for the download button
#                    engines  optional allow-list, [ktransformers, llamacpp]
#                             by default. Name [llamacpp] alone for an
#                             architecture the KTransformers v0.3.2 image
#                             has no optimize rule for (it has deepseek_v3
#                             and qwen3_moe -- engines/ktransformers.py maps
#                             them); the roofline then never schedules a
#                             KTransformers cell that dies at load.
#   kt_only        true when the weights exceed the GPUs outright: GPU
#                  engines never run it, only the GGUF engines do (CPU
#                  experts in host RAM). Prepare then stages the HF repo
#                  config-only -- config + tokenizer, no safetensors.
#   host_ram_gb    host RAM a CPU-expert launch needs: the GGUF (its
#                  experts live in RAM) plus headroom for the runtime.

