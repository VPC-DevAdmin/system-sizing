# Packaged model catalog — the starter set of models capsim knows how
# to stage, sweep, and search over. Local additions go in
# config/models/*.yaml (same schema; the UI's "Add model" writes
# config/models/local.yaml) and win over this file by id.
#
# Entry fields:
#   id             HF repo id (required)
#   family         groups precision variants of the same weights
#   series         vendor family line as an operator says it ("Qwen3")
#   params_b       total parameters in billions (drives size grouping)
#   specialty      instruct (default) | coder
#   moe            true for mixture-of-experts models
#   quant          bf16 | fp8 | awq | gptq-int4 | gptq-int8 | mxfp4 | nvfp4
#   approx_size_gb rough weight footprint (planning aid)
#   min_vram_gb    smallest single-replica VRAM that loads it
#   gated          true when the repo needs an accepted license + HF_TOKEN
#   engine_args    extra vLLM flags this artifact needs, if any
#   notes          one-liner for the UI

